name: Cartera Temporal CI

on:
  push:
    branches:
      - Exodo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t duhudico/cartera_temporal:latest .
          docker push duhudico/cartera_temporal:latest
          
        env:
          DOCKER_BUILDKIT: 1

      - name: Trigger container update
        run: |
          curl -fail -X POST https://watchtowergmj.duckdns.org/v1/update \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}"